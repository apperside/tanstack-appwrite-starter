# Lighthouse CI budgets for the public pages (`pnpm lighthouse`), on the
# production build with Lighthouse's default mobile throttling.
# Ruling R38: LCP is held to the Core Web Vitals "good" mark (2.5 s); the
# spec's original 1.5 s sat below what the mandated stack can reach.
# Port 3011 is also checked free by `pnpm lighthouse` before the run.
ci:
  collect:
    startServerCommand: PORT=3011 node --env-file-if-exists=.env.local .output/server/index.mjs
    startServerReadyPattern: Listening on
    url:
      - http://localhost:3011/login
      - http://localhost:3011/signup
      - http://localhost:3011/forgot-password
    numberOfRuns: 5
    settings:
      chromeFlags: --headless=new
  assert:
    # Each audit's own median: `median-run` picks one run by FCP/TTI, so the
    # LCP it reports can be any run's value.
    aggregationMethod: median
    assertions:
      categories:performance: [error, { minScore: 0.95 }]
      categories:accessibility: [error, { minScore: 0.95 }]
      categories:best-practices: [error, { minScore: 0.95 }]
      categories:seo: [error, { minScore: 0.95 }]
      largest-contentful-paint: [error, { maxNumericValue: 2500 }]
      cumulative-layout-shift: [error, { maxNumericValue: 0.05 }]
  upload:
    target: filesystem
    outputDir: .lighthouseci/reports
